        if: ${{ needs.build_music.result == 'success' && steps.check.outputs.has_payload == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare_music.outputs.tag }}
