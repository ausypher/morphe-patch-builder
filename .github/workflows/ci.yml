name: CI
on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Run the single-patch test even if the patch version did not change"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "0 0-23/3 * * *"

# Avoid overlapping CI checks/builds and races while updating the update branch.
concurrency:
  group: my-youtube-morphe-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check YouTube patches
        id: youtube
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.force_build }}" = "true" ] || ! git checkout origin/update -- build-youtube.md 2>/dev/null; then
            echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
          else
            cp build-youtube.md build.md
            UPDATE_CFG=$(./build.sh config-youtube.toml --config-update)
            echo "SHOULD_BUILD=$([[ -n "$UPDATE_CFG" ]] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Music patches
        id: music
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.force_build }}" = "true" ] || ! git checkout origin/update -- build-music.md 2>/dev/null; then
            echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
          else
            cp build-music.md build.md
            UPDATE_CFG=$(./build.sh config-music.toml --config-update)
            echo "SHOULD_BUILD=$([[ -n "$UPDATE_CFG" ]] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          fi

    outputs:
      YOUTUBE: ${{ steps.youtube.outputs.SHOULD_BUILD }}
      MUSIC: ${{ steps.music.outputs.SHOULD_BUILD }}

  prepare_youtube:
    if: ${{ needs.check.outputs.YOUTUBE == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      next_ver_code: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get next version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          MAX_CODE=0

          if git fetch origin update:refs/remotes/origin/update 2>/dev/null; then
            while IFS= read -r FILE; do
              [ -n "$FILE" ] || continue
              CODE=$(git show "refs/remotes/origin/update:$FILE" 2>/dev/null |
                jq -r '.versionCode // empty' |
                grep -E '^[0-9]+$' || true)
              if [ -n "$CODE" ] && [ "$CODE" -gt "$MAX_CODE" ]; then
                MAX_CODE="$CODE"
              fi
            done < <(
              git ls-tree -r --name-only refs/remotes/origin/update |
                grep -E '(^|/)[^/]*-update\.json$' || true
            )
          fi

          if [ "$MAX_CODE" -eq 0 ]; then
            LEGACY_MAX=$(gh release list --limit 1000 --json tagName \
              -q '.[].tagName' |
              grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
            MAX_CODE="${LEGACY_MAX:-0}"
          fi

          echo "NEXT_VER_CODE=$((MAX_CODE + 1))" >> "$GITHUB_OUTPUT"
          echo "Previous versionCode: $MAX_CODE"
          echo "Next versionCode: $((MAX_CODE + 1))"

      - name: Create draft release
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PREFIX: ${{ 'YouTube Morphe' }}
          APP_ID: ${{ 'youtube' }}
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)

          # Keep ordinary releases under stable- and mark manual A9 builds
          # separately, while preserving a single sortable timestamp format.
          TAG_PREFIX="stable"
          if [ "$APP_ID" = "music" ]; then
            TAG_PREFIX="music"
          elif [ "$RELEASE_PREFIX" = "A9" ]; then
            TAG_PREFIX="a9"
          fi

          TAG=""
          for ATTEMPT in $(seq 1 100); do
            if [ "$ATTEMPT" -eq 1 ]; then
              CANDIDATE="$TAG_PREFIX-$TIMESTAMP"
            else
              CANDIDATE="$TAG_PREFIX-$TIMESTAMP-$((ATTEMPT - 1))"
            fi

            if gh release view "$CANDIDATE" >/dev/null 2>&1; then
              echo "Release $CANDIDATE already exists; trying next tag."
              continue
            fi

            DRAFT_TITLE="$RELEASE_PREFIX build $DATE"
            if [ -n "$RELEASE_PREFIX" ]; then
              DRAFT_TITLE="$RELEASE_PREFIX $DRAFT_TITLE"
            fi
            if gh release create "$CANDIDATE" --draft --target "$GITHUB_SHA" \
              --title "$DRAFT_TITLE" --notes ""; then
              TAG="$CANDIDATE"
              break
            fi

            if gh release view "$CANDIDATE" >/dev/null 2>&1; then
              echo "Tag $CANDIDATE was taken concurrently; trying next tag."
              continue
            fi
            echo "::error::Could not create draft release $CANDIDATE"
            exit 1
          done

          if [ -z "$TAG" ]; then
            echo "::error::Could not allocate a unique draft release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Prepared draft release: $TAG"

  build_youtube:
    needs: prepare_youtube
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install APKMirror scraper dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Update curl_cffi to latest PyPI version
        run: |
          python -m pip install --disable-pip-version-check --upgrade --no-cache-dir curl_cffi
          python -m pip show curl_cffi

      - name: Restore signing keystore
        env:
          MORPHE_KEYSTORE_BASE64: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$MORPHE_KEYSTORE_BASE64"
          printf '%s' "$MORPHE_KEYSTORE_BASE64" | base64 --decode > Morphe.keystore
          chmod 600 Morphe.keystore

      - name: Update config
        if: ${{ false }}
        run: |
          if git checkout origin/update -- build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ -n "$UPDATE_CFG" ]; then
              echo "Updated config: $UPDATE_CFG"
              echo "$UPDATE_CFG" > config.json
            fi
          fi

      - name: Start APKMirror Cloudflare solver
        run: |
          set -euo pipefail
          docker run -d --name apkmirror-cf-solver -p 8000:8000 ghcr.io/sarperavci/cloudflarebypassforscraping:latest
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/docs >/dev/null 2>&1; then
              echo "Cloudflare solver is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Cloudflare solver did not become ready"
          docker logs apkmirror-cf-solver || true
          exit 1

      - name: Build modules/APKs
        run: |
          set -euo pipefail
          if [ -f config.json ]; then
            ./build.sh config.json
          else
            ./build.sh "${{ 'config-youtube.toml' }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ needs.prepare_youtube.outputs.next_ver_code }}

      - name: Validate build output
        if: success()
        run: |
          set -euo pipefail
          test -s build.md || { echo "::error::build.md was not generated"; exit 1; }
          shopt -s nullglob
          apks=(./build/*.apk)
          zips=(./build/*.zip)
          if [ "${#apks[@]}" -eq 0 ] && [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No APK or module ZIP was produced"
            exit 1
          fi
          ls -lh ./build/*

      - name: Upload build payload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-payload-${{ 'youtube' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.md
            build/*
          if-no-files-found: error
          retention-days: 1

      - name: Collect build diagnostics
        if: always()
        shell: bash
        run: |
          docker logs apkmirror-cf-solver > apkmirror-cf-solver.log 2>&1 || true
          {
            echo "Run result diagnostics"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Runner: $RUNNER_OS"
            echo
            echo "Docker containers:"
            docker ps -a || true
            echo
            echo "Build directory:"
            ls -lah ./build 2>&1 || true
          } > diagnostics.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ 'youtube' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.md
            build/
            diagnostics.txt
            apkmirror-cf-solver.log
          if-no-files-found: warn
          retention-days: 7

  release_youtube:
    needs: [prepare_youtube, build_youtube]
    if: ${{ always() && needs.prepare_youtube.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build payload
        if: ${{ needs.build_youtube.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: build-payload-${{ 'youtube' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: payload

      - name: Check build payload
        id: check
        if: ${{ needs.build_youtube.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s payload/build.md
          shopt -s nullglob
          apks=(payload/build/*.apk)
          zips=(payload/build/*.zip)
          if [ "${#apks[@]}" -eq 0 ] && [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::Build payload contains no APK or module ZIP"
            echo "has_payload=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "has_payload=true" >> "$GITHUB_OUTPUT"

      - name: Upload release assets and publish
        id: publish
        if: ${{ needs.build_youtube.result == 'success' && steps.check.outputs.has_payload == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare_youtube.outputs.tag }}
          RELEASE_PREFIX: ${{ 'YouTube Morphe' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ASSETS=(payload/build/*)
          test "${#ASSETS[@]}" -gt 0

          PATCH_VERSION=$(grep -m1 '^Patches:' payload/build.md |
            grep -oE 'patches-[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?\.mpp' |
            head -n1 | sed -E 's/^patches-//; s/\.mpp$//' || true)

          if [ -z "$PATCH_VERSION" ]; then
            echo "::error::Could not determine patch version from build.md"
            exit 1
          fi

          RELEASE_TITLE="$PATCH_VERSION"
          if [ -n "$RELEASE_PREFIX" ]; then
            RELEASE_TITLE="$RELEASE_PREFIX $RELEASE_TITLE"
          fi
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
          gh release edit "$TAG" --title "$RELEASE_TITLE" --notes-file payload/build.md --draft=false
          echo "Published $TAG ($RELEASE_TITLE)"

      - name: Update modules changelog and update json
        if: ${{ needs.build_youtube.result == 'success' && steps.check.outputs.has_payload == 'true' && steps.publish.outcome == 'success' }}
        env:
          TAG: ${{ needs.prepare_youtube.outputs.tag }}
          NEXT_VER_CODE: ${{ needs.prepare_youtube.outputs.next_ver_code }}
          APP_ID: ${{ 'youtube' }}
        run: |
          set -euo pipefail
          cp payload/build.md build.md
          if git fetch origin update; then
            git checkout -B update origin/update
          else
            echo "No update branch exists yet; creating it for the first build."
            git switch --orphan update
            git rm -rf . >/dev/null 2>&1 || true
          fi

          get_update_json() {
            jq -n --arg version "$1" --argjson versionCode "$NEXT_VER_CODE" \
              --arg zipUrl "$2" \
              --arg changelog "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build-${APP_ID}.md" \
              '{version:$version, versionCode:$versionCode, zipUrl:$zipUrl, changelog:$changelog}'
          }

          shopt -s nullglob
          cd payload/build
          for OUTPUT in *module*.zip; do
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            UPDATE_JSON=$(printf '%s\n' "$ZIP_S" | grep 'updateJson' | head -n1 || true)
            [ -n "$UPDATE_JSON" ] || continue
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(printf '%s\n' "$ZIP_S" | grep '^version=' | head -n1 | cut -d= -f2-)
            [ -n "$VER" ] || continue
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$OUTPUT"
            get_update_json "$VER" "$DLURL" > "../../$UPDATE_JSON"
          done
          cd ../..
          find . -name "*-update.json" | grep . >/dev/null || touch dummy-update.json
          cp payload/build.md "build-${APP_ID}.md"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "build-${APP_ID}.md" *-update.json dummy-update.json 2>/dev/null || git add "build-${APP_ID}.md" *-update.json
          if ! git diff --cached --quiet; then
            git commit -m "Bump version $NEXT_VER_CODE"
            git push origin HEAD:update
          else
            echo "No update-branch changes."
          fi

      - name: Delete draft when build did not produce a valid payload
        if: ${{ always() && needs.prepare_youtube.result == 'success' && (needs.build_youtube.result != 'success' || steps.check.outputs.has_payload != 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare_youtube.outputs.tag }}
        run: gh release delete "$TAG" --yes || true

  prepare_music:
    if: ${{ needs.check.outputs.MUSIC == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      next_ver_code: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
    steps:
